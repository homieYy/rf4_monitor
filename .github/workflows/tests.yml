name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m tests.make_demo demo.pcapng
      - run: python rf4_monitor.py --read demo.pcapng --jsonl demo-events.jsonl
      - name: Windows double-click entry (first setup and repeat launch)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv .venv
          if errorlevel 1 exit /b %errorlevel%
          call rf4_monitor.bat --read demo.pcapng
          if errorlevel 1 exit /b %errorlevel%
          call rf4_monitor.bat --help
